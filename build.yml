name: Compilar EJ MASTER (VST3 para Windows)

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Configurar proyecto
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Compilar VST3
        run: cmake --build build --config Release --target EJMaster_VST3

      - name: Preparar archivo final
        shell: pwsh
        run: |
          $vst = Get-ChildItem -Path build -Recurse -Filter "EJ MASTER.vst3" | Select-Object -First 1
          if (-not $vst) { throw "No se encontró EJ MASTER.vst3" }
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item -Recurse -Path $vst.FullName -Destination "dist/EJ MASTER.vst3"

      - name: Subir el plugin
        uses: actions/upload-artifact@v4
        with:
          name: EJ-MASTER-VST3-Windows
          path: dist
